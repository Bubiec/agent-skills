name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$release/$archive" -o "/tmp/$archive"
          curl --fail --silent --show-error --location "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks-checksums.txt
          cd /tmp
          grep "  $archive$" gitleaks-checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan complete Git history
        # Full history also works on an initial push, whose root commit has no parent.
        run: /tmp/gitleaks git . --log-opts=--all --redact --no-banner

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Example prompts match their job files
        run: |
          set -e
          for job in plugins/*/skills/*/examples/*/job.toml; do
            dir=$(dirname "$job")
            python "$(dirname "$(dirname "$dir")")/scripts/build_prompt.py" "$job" > /tmp/prompt.txt
            diff -u "$dir/prompt.txt" /tmp/prompt.txt
          done
      - name: Install local imaging dependencies
        run: pip install Pillow 'resvg-py>=0.5.0,<0.6'
      - name: Offline safety, SVG and perspective tests
        run: python -m unittest discover -s tests -v
      - name: Generator preview runs without credentials
        run: |
          set -e
          skill=plugins/product-photo-studio/skills/product-photo-studio
          mkdir -p /tmp/refs
          printf '\x89PNG\r\n\x1a\n' > /tmp/refs/product.png
          python $skill/scripts/generate.py --prompt "smoke test" --reference /tmp/refs/product.png --output-dir /tmp/out
          test -f /tmp/out/request.json
